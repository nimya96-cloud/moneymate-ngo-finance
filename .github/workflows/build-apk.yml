name: Build MoneyMate NGO APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Flutter SDK 3.24.0
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # Step 4: Verify Flutter version
      - name: Verify Flutter Version
        run: flutter --version

      # Step 5: Regenerate clean Android platform files matching Flutter 3.24 & Kotlin 1.9.24
      - name: Regenerate Clean Android Project
        working-directory: flutter_app
        run: |
          mkdir -p /tmp/lib_backup
          cp -r lib/* /tmp/lib_backup/
          rm -rf android
          flutter create --platforms=android --org=com.moneymate .
          cp -r /tmp/lib_backup/* lib/
          sed -i 's/"org.jetbrains.kotlin.android" version "[^"]*"/"org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      # Step 6: Install Flutter Dependencies
      - name: Install Dependencies
        working-directory: flutter_app
        run: flutter pub get

      # Step 7: Build universal release APK
      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      # Step 8: Upload APK as downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMate-NGO-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Step 9: Show APK info
      - name: Display Build Success Info
        run: |
          APK_PATH="flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "========================================="
          echo "🎉 APK BUILD SUCCESSFUL!"
          echo "📦 APK File Size: $APK_SIZE"
          echo "📥 Download from the Artifacts section above!"
          echo "========================================="
